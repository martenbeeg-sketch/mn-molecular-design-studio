<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#263c32;font:12px Inter,system-ui,sans-serif}#sheet{overflow:auto;max-height:590px;border:1px solid #e5e9e6;border-radius:5px;background:#fcfdfc}table{border-spacing:0;min-width:100%;white-space:nowrap}th{position:sticky;top:0;z-index:2;text-align:left;background:#f3f5f3;color:#7d877f;font-size:10px;font-weight:550;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #dfe5e0;padding:12px}td{border-bottom:1px solid #edf0ed;padding:9px 12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;height:48px}tr:hover td{background:#f1f6f2}tr.focus td{background:#e7f0e9}tr.selected td{box-shadow:inset 0 1px #d9e8dc}th:first-child,td:first-child{position:sticky;left:0;min-width:34px;width:34px;background:#f8faf8;z-index:1;padding:8px}th:first-child{z-index:3}td.name{min-width:155px;max-width:190px;font-weight:550}small{display:block;color:#9ba49c;font:10px monospace;margin-top:3px}.tag{border-radius:3px;background:#edf2e6;color:#657853;padding:2px 5px;font-size:10px}.sequence{font:11px monospace;letter-spacing:1px;max-width:240px}.aa{display:inline-block;padding:1px 0}.diff{background:#dfbdde;color:#6d2b65}.number{font-variant-numeric:tabular-nums;text-align:right}input{accent-color:#276848;cursor:pointer}#empty{padding:25px;color:#829087;text-align:center}tr:focus{outline:2px solid #7fa88c;outline-offset:-2px}
</style></head><body><div id="sheet" role="region" aria-label="Molecules"><table><thead id="head"></thead><tbody id="body"></tbody></table><div id="empty" hidden>No molecules to show.</div></div><script>
let args={},selected=new Set(),focus='',token=0;const send=(type,fields={})=>parent.postMessage({isStreamlitMessage:true,type,...fields},'*');
function notify(){send('streamlit:setComponentValue',{value:{selectedIds:[...selected],focusId:focus,token:Date.now()+'-'+(++token)}})}
function draw(){selected=new Set(args.selected||[]);focus=args.focus||'';const head=document.getElementById('head'),body=document.getElementById('body');head.replaceChildren();body.replaceChildren();const tr=document.createElement('tr'),all=document.createElement('input');all.type='checkbox';all.setAttribute('aria-label','Select all molecules on this page');all.checked=(args.rows||[]).length>0&&args.rows.every(r=>selected.has(r.id));all.onchange=()=>{args.rows.forEach(r=>all.checked?selected.add(r.id):selected.delete(r.id));notify()};const checkHead=document.createElement('th');checkHead.append(all);tr.append(checkHead);for(const column of args.columns){const th=document.createElement('th');th.textContent=column.label;tr.append(th)}head.append(tr);
 for(const row of args.rows){const line=document.createElement('tr');line.tabIndex=0;line.setAttribute('aria-label',row.values.Name+' molecule');line.classList.toggle('focus',row.id===focus);line.classList.toggle('selected',selected.has(row.id));line.onclick=()=>{focus=row.id;notify()};line.onkeydown=e=>{if(e.key==='Enter'){focus=row.id;notify()}};const td=document.createElement('td'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=selected.has(row.id);checkbox.setAttribute('aria-label','Select '+row.values.Name);checkbox.onclick=e=>e.stopPropagation();checkbox.onchange=()=>{checkbox.checked?selected.add(row.id):selected.delete(row.id);notify()};td.append(checkbox);line.append(td);
 for(const col of args.columns){const cell=document.createElement('td'),value=row.values[col.key];cell.title=value==null?'':String(value);if(col.key==='Name'){cell.className='name';cell.textContent=value;const small=document.createElement('small');small.textContent=row.id.slice(-10);cell.append(small)}else if(col.kind==='sequence'){cell.className='sequence';const reference=args.rows[0]?.values[col.key]||'';Array.from(String(value||'').slice(0,72)).forEach((aa,i)=>{const span=document.createElement('span');span.className='aa'+(reference[i]&&reference[i]!==aa?' diff':'');span.textContent=aa;cell.append(span)});if(String(value||'').length>72)cell.append('…')}else if(col.key==='Type'){const tag=document.createElement('span');tag.className='tag';tag.textContent=value;cell.append(tag)}else{cell.textContent=value==null||value===''?'—':String(value);if(typeof value==='number')cell.className='number'}line.append(cell)}body.append(line)}document.getElementById('empty').hidden=Boolean(args.rows.length);send('streamlit:setFrameHeight',{height:Math.min(625,Math.max(160,80+args.rows.length*49))});}
window.addEventListener('message',event=>{if(event.data.type==='streamlit:render'){args=event.data.args;draw()}});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:200});
</script></body></html>
