<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:13px system-ui,sans-serif;color:#203c30}#editor{border:1px solid #dce4de;border-radius:6px;overflow:hidden}button{background:#216347;color:white;border:0;border-radius:4px;padding:9px 14px;cursor:pointer;margin:8px 0}#smiles{font:12px monospace;overflow-wrap:anywhere;margin-left:10px}</style>
<script>let editor;const send=(type,fields={})=>parent.postMessage({isStreamlitMessage:true,type,...fields},'*');function jsmeOnLoad(){editor=new JSApplet.JSME('editor',Math.max(300,document.documentElement.clientWidth-2)+'px','350px',{options:'noreaction,noquery'});send('streamlit:setFrameHeight',{height:410});}function useDrawing(){if(!editor)return;const smiles=editor.smiles();document.getElementById('smiles').textContent=smiles;send('streamlit:setComponentValue',{value:{smiles:smiles,molblock:editor.molFile(),token:Date.now()}});}window.addEventListener('message',event=>{if(event.data.type==='streamlit:render')send('streamlit:setFrameHeight',{height:410});});</script>
<script src="jsme/jsme.nocache.js"></script></head><body><div id="editor" aria-label="Molecule drawing editor"></div><button onclick="useDrawing()">Use drawing</button><span id="smiles"></span><script>send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:410});</script></body></html>
