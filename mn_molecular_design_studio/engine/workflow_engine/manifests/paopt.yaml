tool: paopt_generation
group: ligand-generation
image: mn-paopt:cu128-4294d286
gpu: true
description: conDitar ligand generation steered with paOPT property objectives.
inputs:
  target_pdb: {type: pdb, required: true}
  pocket_pdb: {type: pdb, required: true}
  reference_ligand_sdf: {type: sdf, required: true}
params:
  requested_count: {type: int, default: 64}
  batch_size: {type: int, default: 8}
  seed: {type: int, default: 42}
outputs:
  compound_set: {path: artifacts/generated_compound_set.json, type: compound_set}
  coordinates: {path: artifacts/generated_compounds.sdf, type: ligand_coordinate_set}
