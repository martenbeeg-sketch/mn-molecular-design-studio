tool: openmm_md
group: ligand-md
image: mn-md:cu128
gpu: true
description: Bound protein–ligand system preparation and explicit-solvent OpenMM molecular dynamics.
inputs:
  complex_pdb: {type: pdb, required: true}
  ligand_sdf: {type: sdf, required: true}
params:
  production_ns: {type: float, default: 1.0}
  timestep_fs: {type: float, default: 2.0}
  temperature: {type: float, default: 300.0}
  pressure: {type: float, default: 1.0}
  seed: {type: int, default: 42}
outputs:
  trajectory_set: {path: artifacts/md, type: md_trajectory_set}
  run_summary: {path: artifacts/md/result.json, type: md_run_summary}
