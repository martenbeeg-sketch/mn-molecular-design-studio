tool: unidock_pro
group: ligand-docking
image: mn-docking-suite:cu128-sm120fix
gpu: true
description: GPU-accelerated Uni-Dock Pro structure-based, ligand-based, or hybrid docking for a Studio Database compound set.
inputs:
  target_pdb:
    type: pdb
    required: true
  compound_set_file:
    type: compound_set
    required: true
  reference_ligand_sdf:
    type: sdf
    required: false
params:
  center_x: {type: float, required: true}
  center_y: {type: float, required: true}
  center_z: {type: float, required: true}
  size_x: {type: float, default: 20.0}
  size_y: {type: float, default: 20.0}
  size_z: {type: float, default: 20.0}
  mode: {type: enum, values: [classic, ligand_based, hybrid], default: classic}
  search_mode: {type: str, default: balance}
  num_modes: {type: int, default: 9}
outputs:
  scores:
    path: artifacts/docking_scores.csv
    type: docking_scores
  poses:
    path: artifacts/poses
    type: ligand_poses
