tool: unidock_pro
group: ligand-docking
image: mn-docking-suite:cu128
gpu: true
description: GPU-accelerated Uni-Dock Pro classic receptor docking for a Studio Database compound set.
inputs:
  target_pdb:
    type: pdb
    required: true
  compound_set_file:
    type: compound_set
    required: true
params:
  center_x: {type: float, required: true}
  center_y: {type: float, required: true}
  center_z: {type: float, required: true}
  size_x: {type: float, default: 20.0}
  size_y: {type: float, default: 20.0}
  size_z: {type: float, default: 20.0}
  search_mode: {type: str, default: balance}
  num_modes: {type: int, default: 9}
outputs:
  scores:
    path: artifacts/docking_scores.csv
    type: docking_scores
  poses:
    path: artifacts/poses
    type: ligand_poses
