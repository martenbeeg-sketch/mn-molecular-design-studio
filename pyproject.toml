[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-molecular-design-studio"
version = "0.1.0"
description = "A local interface and API for molecular design workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "biopython",
  "duckdb>=1.4,<2",
  "fastapi",
  "gemmi",
  "matplotlib",
  "numpy>=1.26.4,<3",
  "openpyxl",
  "pandas",
  "pyarrow>=14",
  "plotly>=5.24,<7",
  "pyyaml",
  "py2Dmol @ git+https://github.com/sokrypton/py2Dmol.git@67cbe73f06f49645291ea3e79a06293b0abaa3a7",
  "rdkit",
  "scipy>=1.17.1,<2",
  "streamlit>=1.65",
  "zstandard",
  "typer",
  "uvicorn",
]

[project.optional-dependencies]
secondary-structure = [
  "pydssp==0.9.1",
]
scheduler = [
  "mn-compute-scheduler @ git+ssh://git@github.com/martenbeeg-sketch/mn-compute-scheduler.git",
]
test = [
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
mn-molecular-design-studio = "mn_molecular_design_studio.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mn_molecular_design_studio*"]

[tool.setuptools.package-data]
"mn_molecular_design_studio.engine.workflow_engine.vendor.ligand_runtime" = ["scripts/*.py"]
"mn_molecular_design_studio.engine.workflow_engine.workflows.qc_ovo" = ["LICENSE", "PROVENANCE.md", "*.json"]
"mn_molecular_design_studio.engine.workflow_engine.workflows.rfd4_oracle_runtime" = ["LICENSE-APACHE", "PROVENANCE.md"]
"mn_molecular_design_studio.vendor.sabr" = ["LICENSE"]
"mn_molecular_design_studio.vendor.sabr._anarci" = ["LICENSE"]
"mn_molecular_design_studio.vendor.sabr.assets" = ["*.npz", "*.json"]
"*" = [
  "native/*.cpp",
  "*.yaml",
  "*.nf",
  "*.config",
  "*.tar.gz",
  "*.json",
  "*.html",
  "*.css",
  "*.js",
  "*.png",
  "assets/rfdiffusion3/*.pdb",
  "assets/rfdiffusion3/*.md",
  "assets/rfdiffusion_beta_pairing/**/*",
  "assets/rfdiffusion_beta_pairing/*",
  "assets/proteina_complexa/*.pdb",
  "assets/proteina_complexa/*.md",
  "assets/generators/**/*",
  "assets/generators/*",
  "assets/mpnn/*.pdb",
  "assets/mpnn/*.md",
  "assets/vina/*",
  "assets/inverse_folding/*.pdb",
  "assets/inverse_folding/*.md",
  "components/pipeline_editor/build/*.html",
  "components/pipeline_editor/build/assets/*.js",
  "components/pipeline_editor/build/assets/*.css",
  "components/molecule_sketcher/**/*",
  "components/molecule_sketcher/*",
  "components/molecule_table/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
