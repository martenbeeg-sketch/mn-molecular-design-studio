name: mn-molecular-design-studio
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas
  - biopython
  - gemmi
  - pdbfixer
  - pymol-open-source
  - rdkit
  - pyyaml
  - openjdk=17
  - nextflow
  - openpyxl
  - matplotlib
  - streamlit
  - fastapi
  - uvicorn
  - typer
  - pip
  - pip:
      # pydssp is called with NumPy coordinates, so CPU PyTorch is sufficient.
      # Select the CPU wheel to avoid pip pulling the default CUDA-enabled build.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.1+cpu
      - -e .[secondary-structure]
      - -e ../mn-compute-scheduler
