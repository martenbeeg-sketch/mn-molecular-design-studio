name: mn-molecular-design-studio
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas
  - biopython
  - gemmi
  - pdbfixer
  - pymol-open-source
  - rdkit
  - pyyaml
  - openjdk=17
  - nextflow
  - openpyxl
  - matplotlib
  - streamlit
  - fastapi
  - uvicorn
  - typer
  - pip
  - pip:
      # CUDA PyTorch is used by the active-learning network on the organizer GPU.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - -e .[secondary-structure]
      - -e ../mn-compute-scheduler
